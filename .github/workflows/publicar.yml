name: Ediciones de La Prida

# Tres ediciones al día: 07:00, 14:00 y 20:00 hora de Asturias.
#
# POR QUÉ ESTO NO ES UN SIMPLE CRON. Dos problemas encadenados:
#
# 1. Cron va en UTC y no sabe del cambio de hora, así que España se desplaza una
#    hora dos veces al año.
# 2. Y el gordo: **GitHub NO cumple la hora del cron**. Los disparos programados
#    se retrasan con frecuencia, y bastante: el 22/9/2026 el de las 19:05 UTC
#    saltó a las 21:12, con dos horas y siete minutos de retraso.
#
# La primera versión comprobaba «¿son las 07, las 14 o las 20 en Asturias?» y,
# si no, se paraba. Con el retraso de GitHub esa comprobación fallaba SIEMPRE y
# el diario no llegó a publicarse solo ni una vez en dos días. El fallo era
# silencioso: la ejecución salía en verde, en once segundos, sin hacer nada.
#
# La solución no es afinar la hora, que no está en nuestra mano: es dejar de
# preguntar por la hora exacta y preguntar por la FRANJA. Si estamos dentro de
# una franja y esa edición todavía no se ha publicado hoy, se publica — dé la
# hora que dé el reloj. Un disparo con dos horas de retraso sigue sirviendo, y
# dos disparos de la misma franja no duplican nada.
#
#   05:00 – 11:59  →  edición de la mañana   (la que se promete a las 07:00)
#   12:00 – 17:59  →  edición del mediodía  (la que se promete a las 14:00)
#   18:00 – 04:59  →  edición de la noche   (la que se promete a las 20:00;
#                                            la de madrugada es la de la víspera)
#
# Y por eso mismo las ediciones se NOMBRAN en vez de fecharse a la hora: si el
# disparo llega tarde, el nombre sigue siendo verdad. Ver src/config.mjs.
#
# Y como GitHub además de retrasar disparos a veces se los salta directamente
# (el 23/9/2026 el de las 12:05 UTC no llegó a existir), no se apuesta por seis
# disparos concretos: se mira el reloj UNA VEZ POR HORA. Casi todas las veces la
# respuesta será «esta edición ya salió» y la ejecución termina en segundos sin
# tocar nada. Es barato —el repositorio es público y los minutos no se cobran— y
# quita de en medio el único punto que no controlamos: la puntualidad de GitHub.
# Basta con que UNO de los seis o siete intentos de cada franja llegue.
#
# El minuto 37 no es capricho: en :00 y en :05 se agolpa medio mundo y es cuando
# más se retrasa la cola. A media hora hay menos cola.
#
# MEDIDO EL 08/10/2026: ni siquiera «una vez por hora» se cumple. Del 25/9 al 7/10
# GitHub lanzó entre 3 y 6 de los 24 disparos diarios: unos 4,5. Con tan pocos, la
# franja más corta (mediodía, 6 horas) se quedó sin ningún disparo el 5/10 y el 7/10
# (el 7/10, de 09:08 a 16:50 UTC no llegó ninguno) y esa edición no salió. Por eso
# ahora se llama cuatro veces por hora, en minutos alejados de :00 y :30. El
# guardián sigue impidiendo que una edición salga dos veces, y un disparo que no
# toca termina en unos 15 segundos sin tocar nada.

on:
  schedule:
    - cron: '7,22,37,52 * * * *' # cuatro por hora; el guardián de abajo decide si toca
  workflow_dispatch: # botón manual en la pestaña Actions
  push:
    branches: [main]

  # Y cuando termine cualquiera de los flujos que ESCRIBEN contenido.
  #
  # POR QUÉ HACE FALTA. GitHub no dispara un flujo con los commits que hace otro
  # flujo: es su defensa contra los bucles infinitos. Consecuencia: el robot
  # traducía 95 piezas o se traía las tipografías, hacía su commit... y el
  # trabajo se quedaba ahí, invisible, hasta que alguien subía un fichero a mano
  # o llegaba la edición siguiente. Trabajo hecho que no llegaba al lector, y en
  # silencio, que es la peor forma.
  #
  # `workflow_run` sí escucha el FINAL de esos flujos, y como el evento no es
  # `schedule`, el guardián de abajo publica sin preguntar por la franja.
  workflow_run:
    workflows: ['Traducir el archivo atrasado', 'Traer las tipografías a casa']
    types: [completed]

# Seguridad: por defecto ningún permiso. Cada trabajo pide abajo solo lo suyo.
permissions: {}

# Nunca dos ediciones a la vez: la segunda espera, no se cancela.
concurrency:
  group: laprida
  cancel-in-progress: false

jobs:
  edicion:
    permissions:
      contents: write
      pages: write
      id-token: write
    # Si algo se cuelga (un feed, la API), el trabajo muere a los 90 min
    # en vez de bloquear las ediciones siguientes durante 6 horas.
    timeout-minutes: 90
    # Si el flujo que nos despierta terminó mal, no hay nada nuevo que publicar.
    # Republicar tras un fallo no arregla nada y ensucia el historial de commits,
    # que es justo lo que el guardián de ediciones usa para saber qué salió ya.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Fijado a 24.04: GitHub cambia «ubuntu-latest» a Ubuntu 26 desde el 19/10/2026,
    # y un cambio de sistema no debe llegar sin que nadie lo pruebe.
    runs-on: ubuntu-24.04
    # actions/deploy-pages exige que el trabajo declare el entorno github-pages.
    # Sin estas tres líneas el sitio se construye bien pero el despliegue falla
    # con «Missing environment» y la web se queda como estaba.
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      # El checkout va PRIMERO: para saber si una edición ya salió hay que poder
      # mirar el historial. Con profundidad suficiente para varios días.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 50

      - name: ¿Toca edición ahora?
        id: reloj
        run: |
          HORA=$(TZ=Europe/Madrid date +'%H')
          HOY=$(TZ=Europe/Madrid date +'%d/%m/%Y')
          AYER=$(TZ=Europe/Madrid date -d 'yesterday' +'%d/%m/%Y')
          HORA_N=$((10#$HORA))

          # Las ediciones se llaman por su nombre, no por su hora: una edición
          # anunciada a las 07:00 que sale a las 07:40 se desmiente sola, y la
          # puntualidad de GitHub no está en nuestra mano. El nombre nunca falla.
          #
          # Y las franjas empiezan DOS HORAS ANTES de la hora que el diario
          # promete (05, 12 y 18 en vez de 07, 14 y 20). No es un despiste: si
          # el disparo es puntual, la edición está lista pronto; si llega con
          # dos horas de retraso —lo normal en GitHub—, llega justo a su hora.
          # Estas horas tienen que coincidir con `ediciones` en src/config.mjs.
          if   [ "$HORA_N" -ge 5 ]  && [ "$HORA_N" -lt 12 ]; then FRANJA='de la mañana'; FECHA=$HOY
          elif [ "$HORA_N" -ge 12 ] && [ "$HORA_N" -lt 18 ]; then FRANJA='del mediodía'; FECHA=$HOY
          elif [ "$HORA_N" -ge 18 ]; then                        FRANJA='de la noche';  FECHA=$HOY
          else                                                   FRANJA='de la noche';  FECHA=$AYER
          fi

          echo "edicion=$FRANJA" >> "$GITHUB_OUTPUT"
          echo "fecha_edicion=$FECHA" >> "$GITHUB_OUTPUT"
          echo "Son las $HORA:00 en Asturias · toca la edición $FRANJA del $FECHA"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Lanzado a mano (${{ github.event_name }}): se publica igual."
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          elif git log --pretty=%s -n 40 | grep -qF "Edición $FRANJA del $FECHA"; then
            echo "Esa edición ya salió. No se repite."
            echo "seguir=no" >> "$GITHUB_OUTPUT"
          else
            echo "Esta edición todavía no ha salido. Adelante."
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.reloj.outputs.seguir == 'si'
        with:
          node-version: 22

      - name: Recoger las noticias
        if: steps.reloj.outputs.seguir == 'si' && github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/ingesta.mjs

      # fotos.mjs retira primero las que no acrediten ser de Asturias (una calle
      # de Filipinas llegó a portada el 22/9/2026) y luego busca las que falten.
      - name: Buscar fotos libres para los temas del día
        if: steps.reloj.outputs.seguir == 'si' && github.event_name != 'push'
        run: node scripts/fotos.mjs

      - name: Comprobar el nombre del repositorio
        if: steps.reloj.outputs.seguir == 'si'
        run: |
          ESPERADO="${{ github.repository_owner }}.github.io"
          ACTUAL="${GITHUB_REPOSITORY#*/}"
          if [ "$ACTUAL" != "$ESPERADO" ]; then
            echo "::error::El repositorio se llama '$ACTUAL' y debería llamarse '$ESPERADO'."
            echo "::error::Con otro nombre, GitHub sirve la web en una subcarpeta y se rompen todos los enlaces."
            echo "::error::Solución: Settings → General → Repository name → cámbialo a $ESPERADO."
            exit 1
          fi
          echo "Repositorio correcto: la web se servirá en https://$ESPERADO/"

      - name: Construir el sitio en los cuatro idiomas
        if: steps.reloj.outputs.seguir == 'si'
        env:
          SITIO_URL: https://${{ github.repository_owner }}.github.io
        run: node build.mjs

      - name: Guardar el archivo de noticias
        if: steps.reloj.outputs.seguir == 'si' && github.event_name != 'push'
        run: |
          git config user.name  "La Prida"
          git config user.email "bot@laprida.local"
          git add content/data content/fotos
          # La fecha la pone el paso del reloj, NO `date`: la edición de las 20:00
          # que se publica a las 02:00 pertenece a la víspera, y si el mensaje
          # llevara la fecha de hoy el control de franjas no la reconocería y la
          # repetiría en cada disparo de la noche.
          git diff --staged --quiet || git commit -m "Edición ${{ steps.reloj.outputs.edicion }} del ${{ steps.reloj.outputs.fecha_edicion }}"
          # El 7/10/2026 a las 16:53 UTC GitHub contestó «Internal Server Error» al
          # push, la edición entera se perdió y la web se quedó 13 horas sin
          # actualizar. Un fallo así de GitHub suele durar segundos: se reintenta
          # cuatro veces, esperando cada vez más, y trayendo antes lo que haya
          # entrado en main mientras tanto (una subida a mano, por ejemplo).
          for INTENTO in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "::warning::El push falló (intento $INTENTO de 4). Se reintenta."
            sleep $((INTENTO * 20))
            git pull --rebase --no-edit || { git rebase --abort; echo "::error::No se pudo juntar con lo que hay en main."; exit 1; }
          done
          echo "::error::GitHub rechazó el push cuatro veces. Esta edición no se ha guardado."
          exit 1

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: steps.reloj.outputs.seguir == 'si'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: steps.reloj.outputs.seguir == 'si'
        with:
          path: dist
      - id: despliegue
        if: steps.reloj.outputs.seguir == 'si'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # IndexNow: avisar a los buscadores de que hay edición nueva.
      #
      # VA DESPUÉS DEL DESPLIEGUE a propósito. Avisar antes sería mandar a los
      # buscadores a direcciones que todavía no existen: se llevan un 404, y esa
      # es justo la manera de que dejen de hacerte caso.
      #
      # `continue-on-error` no es pereza: si el aviso falla, el periódico YA está
      # publicado y en la calle. Tumbar una edición correcta porque un servicio
      # de terceros no contesta sería cambiar un problema pequeño por uno grande.
      - name: Avisar a los buscadores (IndexNow)
        if: steps.reloj.outputs.seguir == 'si'
        continue-on-error: true
        run: |
          if [ ! -s indexnow.json ]; then
            echo "Sin aviso que mandar (no hay clave o no hay nada fresco)."
            exit 0
          fi
          CUANTAS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('indexnow.json')).urlList.length)")
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @indexnow.json --max-time 30)
          echo "IndexNow: $CUANTAS direcciones · respuesta HTTP $CODIGO"
          # 200 y 202 son «recibido». 422 suele ser la clave mal puesta.
          case "$CODIGO" in
            200|202) echo "Aviso aceptado." ;;
            422) echo "::warning::IndexNow devolvió 422: revisa que $GITHUB_REPOSITORY sirva la clave en la raíz." ;;
            *)   echo "::warning::IndexNow respondió $CODIGO. La edición está publicada igualmente." ;;
          esac
