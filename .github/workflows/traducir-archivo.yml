name: Traducir el archivo atrasado

# Se lanza A MANO, nunca sola.
#
# La traducción de una pieza ocurre cuando la pieza entra. Las que entraron
# mientras la clave no estaba se quedaron en español para siempre, y volver a
# poner la clave no las rescata: nadie vuelve a mirarlas.
#
# Esto es esa mirada, una vez. Cuando el archivo esté al día, este fichero deja
# de hacer falta — puede quedarse aquí sin molestar, porque sin pulsar el botón
# no se ejecuta nunca.
#
# Cómo se usa: pestaña Actions → «Traducir el archivo atrasado» → Run workflow.
# La primera vez, deja el límite en 5 y mira el resultado antes de soltar las
# cien. Son llamadas a un servicio de pago: conviene ver una muestra primero.

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Cuántas piezas como máximo. Vacío o 0 = TODAS las que falten. Pon 5 para probar.'
        required: false
        default: ''
      forzar:
        description: 'Rehacer también las que YA están traducidas (cuesta dinero: solo si cambió el glosario)'
        required: false
        type: boolean
        default: false

# No a la vez que una edición: las dos escriben en content/data/noticias.json.
concurrency:
  group: laprida
  cancel-in-progress: false

# Seguridad: por defecto ningún permiso. Cada trabajo pide abajo solo lo suyo.
permissions: {}

jobs:
  traducir:
    permissions:
      contents: write
    # Si algo se cuelga (un feed, la API), el trabajo muere a los 240 min
    # en vez de bloquear las ediciones siguientes durante 6 horas.
    timeout-minutes: 240
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Traducir lo que falte
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Las casillas del formulario entran como variables, nunca pegadas en el
          # script: así nada de lo que se escriba ahí puede ejecutarse como orden.
          ENTRADA_LIMITE: ${{ inputs.limite }}
          ENTRADA_FORZAR: ${{ inputs.forzar }}
        run: |
          OPCIONES=""
          # Vacío, 0 o «todas» significan sin límite. Cualquier otra cosa, el número.
          LIMITE="$ENTRADA_LIMITE"
          case "$LIMITE" in
            ''|0|todas|TODAS|all) : ;;
            *[!0-9]*) echo "::error::El límite tiene que ser un número (o vacío). Recibido: $LIMITE"; exit 1 ;;
            *) OPCIONES="$OPCIONES --limite $LIMITE" ;;
          esac
          if [ "$ENTRADA_FORZAR" = "true" ]; then
            OPCIONES="$OPCIONES --forzar"
          fi
          echo "Opciones: ${OPCIONES:-(ninguna)}"
          node scripts/traducir-archivo.mjs $OPCIONES

      - name: Guardar lo traducido
        run: |
          git config user.name  "La Prida"
          git config user.email "bot@laprida.local"
          git add content/data
          # Sin cambios no se hace commit: un commit vacío ensucia el historial,
          # y el historial es lo que usa el guardián de ediciones para saber qué
          # se publicó ya.
          git diff --staged --quiet || git commit -m "Traducción del archivo atrasado"
          git push
